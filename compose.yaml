services:
  mysql:
    image: mysql:8.4
    container_name: stucklog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: stucklog_root_local
      MYSQL_DATABASE: stucklog
      MYSQL_USER: stucklog_app
      MYSQL_PASSWORD: stucklog_local
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - stucklog_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  stucklog_mysql_data:
